<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#faf9f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0b0f"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Applies the stored theme before first paint so there is no flash. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <title>Artem B. — Senior Full-Stack Engineer</title>
    <meta
      name="description"
      content="Portfolio of Artem B., a senior full-stack engineer building production web applications and backend systems with TypeScript, Node.js, NestJS, React and Next.js."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Artem B. — Senior Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Artem B., a senior full-stack engineer building production web applications and backend systems with TypeScript, Node.js, NestJS, React and Next.js."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
